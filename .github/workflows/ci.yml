name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Require a production runtime on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node plugins/atbash/runtime-environment.mjs --require prod

      - name: Verify committed marketplace runtime
        run: |
          ATBASH_BUILD_ENV="$(node plugins/atbash/runtime-environment.mjs)" npm run build:marketplace
          git diff --exit-code -- plugins/atbash/runtime
